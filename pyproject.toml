[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aorta"
version = "0.1.0"
description = "Pipeline open source per la biomeccanica dell'aorta: imaging, AI, CFD e FEM"
requires-python = ">=3.11"

[tool.pytest.ini_options]
# permette ai test di fare `import aorta` senza installare il pacchetto
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
# controllo automatico del codice: `ruff check src tests scripts`
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I"]  # errori, nomi inutilizzati, spazi, ordine degli import
